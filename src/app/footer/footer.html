<footer class="footer">
  <nav aria-label="Contact links" class="footer__links">
    @for (contact of contactLinks(); track contact.href) {
      <a
        class="footer__link"
        [href]="contact.href"
        [attr.aria-label]="contact.ariaLabel"
        [attr.rel]="contact.openInNewTab ? 'noopener noreferrer' : null"
        [attr.target]="contact.openInNewTab ? '_blank' : null"
      >
        <span class="footer__icon" aria-hidden="true">
          @switch (contact.icon) {
            @case ('email') {
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v.2l8 5 8-5V7H4zm16 10V9.3l-7.4 4.6a1 1 0 0 1-1 0L4 9.3V17h16z" />
              </svg>
            }
            @case ('github') {
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34a2.65 2.65 0 0 0-1.1-1.45c-.9-.61.07-.6.07-.6a2.1 2.1 0 0 1 1.53 1 2.16 2.16 0 0 0 2.95.84 2.13 2.13 0 0 1 .64-1.34c-2.23-.25-4.57-1.12-4.57-5a3.93 3.93 0 0 1 1-2.73 3.67 3.67 0 0 1 .1-2.7s.84-.27 2.75 1a9.3 9.3 0 0 1 5 0c1.9-1.31 2.74-1 2.74-1a3.66 3.66 0 0 1 .1 2.7 3.93 3.93 0 0 1 1 2.73c0 3.87-2.34 4.72-4.58 5a2.37 2.37 0 0 1 .68 1.84v2.72c0 .27.18.58.69.48A10 10 0 0 0 12 2z" />
              </svg>
            }
            @case ('telegram') {
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M21.8 4.2a1.25 1.25 0 0 0-1.3-.16L3.5 11.3a1.25 1.25 0 0 0 .11 2.34l4.86 1.73 1.84 5.63a1.25 1.25 0 0 0 2.03.55l2.64-2.43 4.6 3.35a1.25 1.25 0 0 0 1.96-.77l2.5-15.5a1.25 1.25 0 0 0-.24-.99zM9.16 13.86l-3.67-1.3 12.64-5-7.37 6.3a1.25 1.25 0 0 0-.4.67l-.46 2.65-1.28-3.32a1.25 1.25 0 0 0-.46-.65z" />
              </svg>
            }
            @case ('matrix') {
              <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M0.844 0.735v30.531h2.197v0.735h-3.041v-32h3.041v0.735zM10.235 10.412v1.547h0.041c0.412-0.595 0.912-1.047 1.489-1.371 0.579-0.323 1.251-0.484 2-0.484 0.719 0 1.38 0.141 1.975 0.417 0.599 0.281 1.047 0.776 1.359 1.479 0.339-0.5 0.803-0.943 1.38-1.323 0.579-0.38 1.267-0.573 2.063-0.573 0.604 0 1.161 0.073 1.677 0.224 0.521 0.145 0.959 0.38 1.328 0.703 0.365 0.329 0.651 0.751 0.86 1.272 0.203 0.52 0.307 1.151 0.307 1.891v7.635h-3.129v-6.468c0-0.381-0.016-0.745-0.048-1.084-0.020-0.307-0.099-0.604-0.239-0.88-0.131-0.251-0.333-0.459-0.584-0.593-0.255-0.152-0.609-0.224-1.047-0.224-0.443 0-0.797 0.083-1.068 0.249-0.265 0.167-0.489 0.396-0.64 0.667-0.161 0.287-0.265 0.604-0.308 0.927-0.052 0.349-0.077 0.699-0.083 1.048v6.359h-3.131v-6.401c0-0.339-0.005-0.672-0.025-1-0.011-0.317-0.073-0.624-0.193-0.916-0.104-0.281-0.301-0.516-0.552-0.672-0.255-0.167-0.636-0.255-1.136-0.255-0.151 0-0.348 0.031-0.588 0.099-0.24 0.067-0.479 0.192-0.703 0.375-0.229 0.188-0.428 0.453-0.589 0.797-0.161 0.343-0.239 0.796-0.239 1.359v6.62h-3.131v-11.421zM31.156 31.265v-30.531h-2.197v-0.735h3.041v32h-3.041v-0.735z"></path> </g></svg>
